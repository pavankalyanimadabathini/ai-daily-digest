name: Daily AI digest

# Runs every morning and drafts one LinkedIn post from the latest AI news.
# 13:00 UTC = 6:00 AM in Phoenix (MST, no daylight saving time).

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:  # also allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit the new drafts back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the digest
        run: python digest.py --limit 1

      - name: Commit new drafts
        run: |
          git config user.name "ai-daily-digest"
          git config user.email "ai-daily-digest@users.noreply.github.com"
          git add drafts state
          git diff --quiet --cached || git commit -m "Add daily AI digest drafts"
          git push origin HEAD:main
